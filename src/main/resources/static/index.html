<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KTX Portal — Hệ thống quản lý ký túc xá</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- ============ MÀN HÌNH ĐĂNG NHẬP / ĐĂNG KÝ ============ -->
<div id="screen-auth" class="auth-screen">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="auth-brand-mark">KTX</span>
      <span class="auth-brand-name">Portal quản lý ký túc xá</span>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab is-active" data-tab="login">Đăng nhập</button>
      <button class="auth-tab" data-tab="register">Đăng ký (sinh viên)</button>
    </div>

    <form id="form-login" class="auth-form">
      <label>Tên đăng nhập
        <input type="text" id="login-username" required autocomplete="username">
      </label>
      <label>Mật khẩu
        <input type="password" id="login-password" required autocomplete="current-password">
      </label>
      <button type="submit" class="btn btn-primary btn-block">Đăng nhập</button>
      <p class="auth-hint">Tài khoản Ban quản lý mặc định: <code>admin / admin123</code></p>
    </form>

    <form id="form-register" class="auth-form" hidden>
      <label>Họ tên
        <input type="text" id="reg-hoten" required>
      </label>
      <label>MSSV
        <input type="text" id="reg-mssv" required>
      </label>
      <label>Tên đăng nhập
        <input type="text" id="reg-username" required>
      </label>
      <label>Mật khẩu
        <input type="password" id="reg-password" required>
      </label>
      <label>Email (không bắt buộc)
        <input type="email" id="reg-email">
      </label>
      <label>Số điện thoại (không bắt buộc)
        <input type="tel" id="reg-phone">
      </label>
      <button type="submit" class="btn btn-primary btn-block">Tạo tài khoản</button>
    </form>

    <p id="auth-message" class="auth-message" hidden></p>
  </div>
</div>

<script src="/js/common.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
