# Cổng chạy của Spring Boot
server.port=8081

# Cấu hình kết nối MySQL đúng theo thông số trong ảnh
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/ql_ktx?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Cấu hình Hibernate tự tạo/cập nhật bảng từ các Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==== Jackson ====
spring.jackson.date-format=dd/MM/yyyy
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# ==== Upload file (neu dinh kem hop dong, anh...) ====
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB