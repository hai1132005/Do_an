# Profile "docker" - dung khi chay trong container (docker-compose.yml dat
# SPRING_PROFILES_ACTIVE=docker). Khac ban local o cho: host MySQL la ten
# service "mysql" (khong phai 127.0.0.1) va cac gia tri nhay cam (mat
# khau DB, SMTP, VNPay) duoc lay tu bien moi truong thay vi ghi cung trong
# application.properties (diem 4 nhan xet cua thay: "them buoc trien khai").
server.port=8081

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jackson.date-format=dd/MM/yyyy
spring.jackson.time-zone=Asia/Ho_Chi_Minh

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

ktx.mail.bat-kich-hoat=${KTX_MAIL_BAT-KICH-HOAT:false}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return-url=${VNPAY_RETURN-URL:https://localhost/api/thanh-toan/vnpay-callback}
