# Trien khai he thong QL_KTX: app (Spring Boot) + MySQL + Nginx (reverse proxy/SSL)
# Giai quyet diem 4 nhan xet cua thay: "them buoc trien khai".
#
# Chay: docker compose up -d --build
# App chay noi bo tren cong 8081 (qua service "app"), Nginx lam reverse
# proxy ra ngoai tren cong 80/443 va la noi "cham dut" SSL.

version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: ktx_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ql_ktx
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - ktx_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: ktx_app
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ql_ktx?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      KTX_MAIL_BAT-KICH-HOAT: ${KTX_MAIL_BAT_KICH_HOAT:-false}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      VNPAY_TMN-CODE: ${VNPAY_TMN_CODE:-SANDBOXCODE}
      VNPAY_HASH-SECRET: ${VNPAY_HASH_SECRET:-SANDBOXSECRET}
      VNPAY_RETURN-URL: ${VNPAY_RETURN_URL:-https://localhost/api/thanh-toan/vnpay-callback}
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "8081"

  nginx:
    image: nginx:1.27-alpine
    container_name: ktx_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app

volumes:
  ktx_mysql_data:
