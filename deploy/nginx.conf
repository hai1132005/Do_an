# Reverse proxy + SSL cho he thong QL_KTX (diem 4 nhan xet cua thay: "them buoc trien khai").
# Chung thi tu ky (self-signed) dat tai ./deploy/ssl/ cho moi truong demo/local:
#   openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#     -keyout deploy/ssl/privkey.pem -out deploy/ssl/fullchain.pem \
#     -subj "/CN=ktx.local"
# O moi truong that, thay 2 file nay bang chung chi Let's Encrypt / CA that.

server {
    listen 80;
    server_name ktx.local;
    # Chuyen huong toan bo HTTP sang HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ktx.local;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 10M;

    location / {
        proxy_pass http://app:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
